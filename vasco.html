<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garagem do Vasco | +100 Superesportivos</title>
    <style>
        /* Variáveis de Tema (Modo Escuro Padrão) */
        :root {
            --bg-body: #0d0d0d;
            --bg-header: #1a1a1a;
            --bg-card: #141414;
            --border-color: #222;
            --text-main: #ffffff;
            --text-sub: #aaa;
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        /* Variáveis para o Modo Claro */
        [data-theme="light"] {
            --bg-body: #f5f5f5;
            --bg-header: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e0e0e0;
            --text-main: #1a1a1a;
            --text-sub: #555;
            --btn-bg: #1a1a1a;
            --btn-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
        }

        header {
            background-color: var(--bg-header);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff0000; /* Vermelho Cruz de Malta */
            position: relative;
        }

        /* Menu de Interação Superior */
        .menu-interacao {
            display: flex;
            justify-content: flex-end;
            max-width: 1400px;
            margin: 0 auto 15px auto;
            padding: 0 10px;
        }

        .btn-tema {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        header span {
            color: #ff0000;
        }

        /* Barra de Busca */
        .busca-container {
            margin-top: 10px;
        }

        .busca-input {
            padding: 12px 20px;
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .busca-input:focus {
            border-color: #ff0000;
        }

        /* Grid de Carros */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cartão do Carro */
        .card {
            background-color: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.15);
            border-color: #ff0000;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #222;
        }

        .card-content {
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-content h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card-content p {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .btn-interagir {
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-interagir:hover {
            background-color: #cc0000;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--bg-header);
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <!-- Menu de Interação Superior -->
        <div class="menu-interacao">
            <button class="btn-tema" id="btn-tema" onclick="alternarTema()">
                <span>Mudar Tema</span> 🌗
            </button>
        </div>

        <h1>Garagem do <span>Vasco</span></h1>
        <div class="busca-container">
            <input type="text" id="busca" class="busca-input" placeholder="Pesquise entre os 100+ carros..." oninput="filtrarCarros()">
        </div>
    </header>

    <main class="container" id="vitrine-carros"></main>

    <!-- Som do motor de volta -->
    <audio id="som-motor" src="https://soundjay.com" preload="auto"></audio>

    <footer>
        <p>&copy; 2026 Garagem do Vasco - Superesportivos Temáticos.</p>
    </footer>

    <script>
        const listaCarros = [];
        const marcas = ["Ferrari", "Lamborghini", "Porsche", "McLaren", "Aston Martin", "Bugatti", "Audi R8", "Nissan GTR", "Corvette", "Mustang Shelby"];
        
        // Links diretos e funcionais de alta qualidade focados estritamente em carros esportivos modernos
        const imagensCarros = [
            "https://unsplash.com", // Porsche
            "https://unsplash.com", // Carro Esportivo
            "https://unsplash.com", // Esportivo Amarelo
            "https://unsplash.com"  // Esportivo Moderno
        ];

        // Gera os 102 carros esportivos automaticamente
        for (let i = 1; i <= 102; i++) {
            const marcaAleatoria = marcas[Math.floor(Math.random() * marcas.length)];
            const imagemAleatoria = imagensCarros[Math.floor(Math.random() * imagensCarros.length)];
            
            listaCarros.push({
                id: i,
                nome: `${marcaAleatoria} Vasco Edition V${Math.random() > 0.5 ? '8' : '12'}`,
                desc: `Edição exclusiva com acabamento em fibra de carbono, aerodinâmica customizada e ronco agressivo de pista.`,
                img: imagemAleatoria
            });
        }

        const vitrine = document.getElementById('vitrine-carros');

        function renderizarCarros(carros) {
            vitrine.innerHTML = ""; 
            carros.forEach(carro => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('onclick', 'tocarSom()');
                
                card.innerHTML = `
                    <img src="${carro.img}" alt="${carro.nome}">
                    <div class="card-content">
                        <h3>${carro.nome}</h3>
                        <p>${carro.desc}</p>
                        <button class="btn-interagir">Ouvir Motor 🔊</button>
                    </div>
                `;
                vitrine.appendChild(card);
            });
        }

        function filtrarCarros() {
            const termoBusca = document.getElementById('busca').value.toLowerCase();
            const carrosFiltrados = listaCarros.filter(carro => 
                carro.nome.toLowerCase().includes(termoBusca)
            );
            renderizarCarros(carrosFiltrados);
        }

        function tocarSom() {
            const som = document.getElementById('som-motor');
            som.currentTime = 0; 
            som.play().catch(error => console.log("Clique interativo necessário para reproduzir áudio."));
        }

        // Função para alternar o Tema (Claro / Escuro)
        function alternarTema() {
            const corpo = document.documentElement;
            const temaAtual = corpo.getAttribute('data-theme');
            
            if (temaAtual === 'light') {
                corpo.removeAttribute('data-theme');
            } else {
                corpo.setAttribute('data-theme', 'light');
            }
        }

        // Inicializa a vitrine
        renderizarCarros(listaCarros);
    </script>
</body>
</html>
