<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog do Vasco | Notícias e Conteúdo do Gigante</title>
    <style>
        /* Variáveis de Tema (Modo Escuro Padrão) */
        :root {
            --bg-body: #0d0d0d;
            --bg-header: #1a1a1a;
            --bg-card: #141414;
            --border-color: #222;
            --text-main: #ffffff;
            --text-sub: #aaa;
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        /* Variáveis para o Modo Claro */
        [data-theme="light"] {
            --bg-body: #f5f5f5;
            --bg-header: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e0e0e0;
            --text-main: #1a1a1a;
            --text-sub: #555;
            --btn-bg: #1a1a1a;
            --btn-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
        }

        header {
            background-color: var(--bg-header);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff0000; /* Vermelho Cruz de Malta */
            position: relative;
        }

        /* Menu de Interação Superior */
        .menu-interacao {
            display: flex;
            justify-content: flex-end;
            max-width: 1400px;
            margin: 0 auto 15px auto;
            padding: 0 10px;
        }

        .btn-tema {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        header span {
            color: #ff0000;
        }

        /* Barra de Busca */
        .busca-container {
            margin-top: 10px;
        }

        .busca-input {
            padding: 12px 20px;
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .busca-input:focus {
            border-color: #ff0000;
        }

        /* Grid de Notícias */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cartão do Post */
        .card {
            background-color: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.15);
            border-color: #ff0000;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-content h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card-content p {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .btn-interagir {
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-interagir:hover {
            background-color: #cc0000;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--bg-header);
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <!-- Menu de Interação Superior -->
        <div class="menu-interacao">
            <button class="btn-tema" id="btn-tema" onclick="alternarTema()">
                <span>Mudar Tema</span> 🌗
            </button>
        </div>

        <h1>Blog do <span>Vasco</span></h1>
        <div class="busca-container">
            <input type="text" id="busca" class="busca-input" placeholder="Pesquise entre as notícias..." oninput="filtrarPosts()">
        </div>
    </header>

    <main class="container" id="vitrine-posts"></main>

    <audio id="som-torcida" src="https://mixkit.co" preload="auto"></audio>

    <footer>
        <p>&copy; 2026 Blog do Vasco - Conteúdo feito por e para vascaínos.</p>
    </footer>

    <script>
        const listaPosts = [];
        const temasNoticias = [
            "Bastidores de São Januário", 
            "Análise Tática do Elenco", 
            "Preparação para o Próximo Jogo", 
            "Destaques da Base Forte", 
            "História do Gigante da Colina", 
            "Opinião: O Sentimento Não Para"
        ];
        
        const imagensFutebol = [
            "https://unsplash.com",
            "https://unsplash.com",
            "https://unsplash.com",
            "https://unsplash.com"
        ];

        // Gera os 102 posts automaticamente
        for (let i = 1; i <= 102; i++) {
            const temaAleatorio = temasNoticias[Math.floor(Math.random() * temasNoticias.length)];
            const imagemAleatoria = imagensFutebol[Math.floor(Math.random() * imagensFutebol.length)];
            
            listaPosts.push({
                id: i,
                titulo: `${temaAleatorio} - Artigo #${i}`,
                desc: `Acompanhe as últimas informações e debates sobre o dia a dia do Club de Regatas Vasco da Gama.`,
                img: imagemAleatoria
            });
        }

        const vitrine = document.getElementById('vitrine-posts');

        function renderizarPosts(posts) {
            vitrine.innerHTML = ""; 
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('onclick', 'tocarTorcida()');
                
                card.innerHTML = `
                    <img src="${post.img}" alt="${post.titulo}">
                    <div class="card-content">
                        <h3>${post.titulo}</h3>
                        <p>${post.desc}</p>
                        <button class="btn-interagir">Vibrar Torcida 🔊</button>
                    </div>
                `;
                vitrine.appendChild(card);
            });
        }

        function filtrarPosts() {
            const termoBusca = document.getElementById('busca').value.toLowerCase();
            const postsFiltrados = listaPosts.filter(post => 
                post.titulo.toLowerCase().includes(termoBusca)
            );
            renderizarPosts(postsFiltrados);
        }

        function tocarTorcida() {
            const som = document.getElementById('som-torcida');
            som.currentTime = 0; 
            som.play().catch(error => console.log("Clique interativo necessário."));
        }

        // Função para alternar o Tema (Claro / Escuro)
        function alternarTema() {
            const corpo = document.documentElement;
            const temaAtual = corpo.getAttribute('data-theme');
            
            if (temaAtual === 'light') {
                corpo.removeAttribute('data-theme');
            } else {
                corpo.setAttribute('data-theme', 'light');
            }
        }

        // Inicializa com a lista completa
        renderizarPosts(listaPosts);
    </script>
</body>
</html>
